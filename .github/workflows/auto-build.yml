name: Yadavar Auto Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Restore release keystore
        env:
          KEYSTORE: ${{ secrets.YADAVAR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > app/yadavar-release.jks
          test -s app/yadavar-release.jks
      - name: Build signed release
        env:
          YADAVAR_KEYSTORE_PASSWORD: ${{ secrets.YADAVAR_KEYSTORE_PASSWORD }}
          YADAVAR_KEY_ALIAS: ${{ secrets.YADAVAR_KEY_ALIAS }}
          YADAVAR_KEY_PASSWORD: ${{ secrets.YADAVAR_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yadavar-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Cleanup
        if: always()
        run: rm -f app/yadavar-release.jks
