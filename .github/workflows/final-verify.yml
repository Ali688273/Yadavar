name: Yadavar Final Verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore release keystore
        env:
          YADAVAR_KEYSTORE_BASE64: ${{ secrets.YADAVAR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$YADAVAR_KEYSTORE_BASE64" | base64 --decode > app/yadavar-release.jks
          test -s app/yadavar-release.jks
      - name: Build signed release
        env:
          YADAVAR_KEYSTORE_PASSWORD: ${{ secrets.YADAVAR_KEYSTORE_PASSWORD }}
          YADAVAR_KEY_ALIAS: ${{ secrets.YADAVAR_KEY_ALIAS }}
          YADAVAR_KEY_PASSWORD: ${{ secrets.YADAVAR_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - if: always()
        run: rm -f app/yadavar-release.jks
